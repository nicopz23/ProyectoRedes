<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Manager - Gestión de Mascotas</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <!-- Encabezado con navegación -->
    <header>
        <div class="container">
            <div class="brand-wrapper">
                <h1><a href="/">PET MANAGER</a></h1>
                <span id="badgeRol" class="indicador-rol badge badge-ciudadano">...</span>
            </div>
            <nav class="nav-links">
                <a href="/">Inicio</a>
                <a href="/dashboard.html">Dashboard</a>
                <a href="/mascotas.html" class="active">Mascotas</a>
                <a href="/propietarios.html">Propietarios</a>
                <a href="/docs" target="_blank">API Docs</a>
                <button id="btnCambiarPin" class="btn btn-outline" style="display: none; font-size: 0.82rem;">🔑 Cambiar PIN</button>
                <button id="btnCerrarSesion" class="btn btn-outline" style="font-size: 0.82rem;">🚪 Cerrar Sesión</button>
            </nav>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="container">

        <!-- Mensajes de Alerta -->
        <div id="mensajeAlerta" class="alerta"></div>

        <!-- Encabezado de la página -->
        <div class="encabezado-seccion">
            <div>
                <h2 id="tituloSeccionMascotas">Mis Mascotas</h2>
                <div class="subtitulo" id="subtituloMascotas">Gestiona los animales de compañía registrados bajo tu cuenta</div>
            </div>
            <div>
                <button id="btnNuevaMascota" class="btn btn-success">+ Registrar Mascota</button>
            </div>
        </div>

        <!-- Panel de Filtros y Búsqueda -->
        <div class="panel-filtros">
            <input type="text" id="inputBuscar" placeholder="🔍 Buscar por nombre o raza...">
            <select id="selectFiltroEspecie">
                <option value="">Todas las especies</option>
                <option value="Perro">Perros</option>
                <option value="Gato">Gatos</option>
                <option value="Ave">Aves</option>
                <option value="Conejo">Conejos</option>
            </select>
            <select id="selectFiltroVacuna">
                <option value="">Cualquier estado de vacuna</option>
                <option value="1">Solo Vacunados</option>
                <option value="0">Solo No Vacunados</option>
            </select>
        </div>

        <!-- Listado en cuadrícula de tarjetas -->
        <div id="listaMascotas" class="grid-tarjetas">
            <p>Cargando información de mascotas...</p>
        </div>

    </main>

    <!-- Modal para Agregar o Editar Mascota -->
    <div id="modalMascota" class="modal">
        <div class="modal-contenido">
            <div class="modal-header">
                <h3 id="modalTitulo">Registrar Mascota</h3>
                <span id="btnCerrarModal" class="cerrar">&times;</span>
            </div>

            <form id="formularioMascota">
                <input type="hidden" id="mascotaId">

                <div class="campo">
                    <label for="nombre">Nombre de la Mascota *</label>
                    <input type="text" id="nombre" required placeholder="Ej: Toby">
                </div>

                <div class="campo">
                    <label for="especie">Especie *</label>
                    <select id="especie" required>
                        <option value="">-- Seleccionar --</option>
                        <option value="Perro">Perro</option>
                        <option value="Gato">Gato</option>
                        <option value="Ave">Ave</option>
                        <option value="Conejo">Conejo</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="raza">Raza</label>
                    <input type="text" id="raza" placeholder="Ej: Golden Retriever">
                </div>

                <div class="campo">
                    <label for="edad">Edad (en años)</label>
                    <input type="number" id="edad" min="0" max="40" placeholder="Ej: 3">
                </div>

                <div class="campo">
                    <label for="sexo">Sexo</label>
                    <select id="sexo">
                        <option value="Macho">Macho</option>
                        <option value="Hembra">Hembra</option>
                        <option value="No especificado">No especificado</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="vacunado">Estado de Vacunación</label>
                    <select id="vacunado">
                        <option value="1">Vacunado / Esquema Completo</option>
                        <option value="0">Pendiente / No Vacunado</option>
                    </select>
                </div>

                <div class="campo" id="contenedorCampoPropietario">
                    <label for="propietarioId">Propietario Asociado *</label>
                    <select id="propietarioId" required>
                        <option value="">-- Seleccione Propietario --</option>
                    </select>
                </div>

                <div class="modal-acciones">
                    <button type="button" id="btnCancelar" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Pie de página -->
    <footer>
        <p>Pet Manager © 2026-09 | Redes e Infraestructura</p>
    </footer>

    <script src="/js/roles.js"></script>
    <script src="/js/mascotas.js"></script>

</body>

</html>
