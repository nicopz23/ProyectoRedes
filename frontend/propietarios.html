<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Manager - Directorio de Propietarios</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <!-- Encabezado con navegación -->
    <header>
        <div class="container">
            <div class="brand-wrapper">
                <h1><a href="/">PET MANAGER</a></h1>
                <span id="badgeRol" class="indicador-rol badge badge-ciudadano">...</span>
            </div>
            <nav class="nav-links">
                <a href="/">Inicio</a>
                <a href="/dashboard.html">Dashboard</a>
                <a href="/mascotas.html">Mascotas</a>
                <a href="/propietarios.html" class="active">Propietarios</a>
                <a href="/docs" target="_blank">API Docs</a>
                <button id="btnCambiarPin" class="btn btn-outline" style="display: none; font-size: 0.82rem;">🔑 Cambiar PIN</button>
                <button id="btnCerrarSesion" class="btn btn-outline" style="font-size: 0.82rem;">🚪 Cerrar Sesión</button>
            </nav>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="container">

        <!-- Alerta de mensajes -->
        <div id="mensajeAlerta" class="alerta"></div>

        <!-- Encabezado de la página -->
        <div class="encabezado-seccion">
            <div>
                <h2 id="tituloSeccionPropietarios">Mi Perfil de Tutor</h2>
                <div class="subtitulo" id="subtituloPropietarios">Información personal y de contacto del tutor responsable</div>
            </div>
            <div>
                <button id="btnNuevoPropietario" class="btn btn-success solo-admin" style="display: none;">+ Nuevo Propietario</button>
                <button id="btnEditarMiPerfil" class="btn btn-primary solo-comun">✏️ Editar Mis Datos</button>
            </div>
        </div>

        <!-- Panel de Búsqueda (Solo visible para Admin que ve todo el directorio) -->
        <div class="panel-filtros solo-admin" style="display: none;">
            <input type="text" id="inputBuscarPropietario" placeholder="🔍 Buscar propietario por nombre, teléfono o email...">
        </div>

        <!-- Contenedor donde se muestran los datos (perfil personal o directorio completo) -->
        <div id="listaPropietarios" class="grid-tarjetas">
            <p>Cargando información...</p>
        </div>
    </main>

    <!-- Modal para Agregar / Editar Propietario -->
    <div id="modalPropietario" class="modal">
        <div class="modal-contenido">
            <div class="modal-header">
                <h3 id="modalTitulo">Editar Tutor</h3>
                <span id="btnCerrarModal" class="cerrar">&times;</span>
            </div>

            <form id="formularioPropietario">
                <input type="hidden" id="propietarioId">

                <div class="campo">
                    <label for="nombre">Nombre Completo *</label>
                    <input type="text" id="nombre" required placeholder="Ej: Carlos Gómez">
                </div>

                <div class="campo">
                    <label for="telefono">Teléfono de Contacto</label>
                    <input type="text" id="telefono" placeholder="Ej: 3001234567">
                </div>

                <div class="campo">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="Ej: carlos.gomez@email.com">
                </div>

                <div class="campo">
                    <label for="password">Contraseña de Acceso</label>
                    <input type="password" id="password" placeholder="Dejar en blanco para mantener la actual">
                </div>

                <div class="modal-acciones">
                    <button type="button" id="btnCancelar" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Pie de página -->
    <footer>
        <p>Pet Manager © 2026-09 | Redes e Infraestructura</p>
    </footer>

    <script src="/js/roles.js"></script>
    <script src="/js/propietarios.js"></script>
</body>

</html>
