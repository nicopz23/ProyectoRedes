events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Resolver DNS interno de Docker (127.0.0.11) para resolución dinámica y resiliente en Swarm
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;
        listen [::]:80;
        server_name localhost petmanager.local;

        # Variables dinámicas para endpoints de backend
        set $auth_backend "http://service-auth:8001";
        set $mascotas_backend "http://service-mascotas:8002";
        set $analytics_backend "http://service-analytics:8003";

        # 1. Prioridad: Servir archivos estáticos del Frontend (.html, .css, .js, assets)
        location ~* \.(html|css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }

        # 2. Ruta raíz "/"
        location = / {
            root /usr/share/nginx/html;
            try_files /index.html /login.html =404;
        }

        # 3. Health check del proxy
        location /health {
            return 200 '{"status":"healthy","service":"frontend-proxy"}';
            add_header Content-Type application/json;
        }

        # 4. Endpoints de la API - Autenticación y Seguridad
        location /auth {
            proxy_pass $auth_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin {
            proxy_pass $auth_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. Endpoints de la API - Mascotas y Propietarios
        location /mascotas {
            proxy_pass $mascotas_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /propietarios {
            proxy_pass $mascotas_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 6. Endpoints de la API - Dashboard
        location /dashboard {
            proxy_pass $mascotas_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 7. Endpoints de la API - Procesamiento Paralelo Distribuido (Spark / MapReduce)
        location /analytics {
            proxy_pass $analytics_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Fallback para cualquier otra ruta estática
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
