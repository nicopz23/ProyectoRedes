version: "3.8"

services:
  # Base de Datos Distribuida PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: petmanager-db
    environment:
      POSTGRES_DB: petmanager_db
      POSTGRES_USER: petuser
      POSTGRES_PASSWORD: petpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init_postgres.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petuser -d petmanager_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Microservicio de Autenticación, Seguridad y Roles
  service-auth:
    build:
      context: .
      dockerfile: microservices/service-auth/Dockerfile
    container_name: petmanager-service-auth
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: petuser
      DB_PASSWORD: petpass
      DB_NAME: petmanager_db
      PORT: 8001
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Microservicio de Mascotas, Propietarios y Analíticas
  service-mascotas:
    build:
      context: .
      dockerfile: microservices/service-mascotas/Dockerfile
    container_name: petmanager-service-mascotas
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: petuser
      DB_PASSWORD: petpass
      DB_NAME: petmanager_db
      PORT: 8002
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Microservicio de Procesamiento Paralelo Distribuido (Apache Spark / MapReduce)
  service-analytics:
    build:
      context: .
      dockerfile: microservices/service-analytics/Dockerfile
    container_name: petmanager-service-analytics
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: petuser
      DB_PASSWORD: petpass
      DB_NAME: petmanager_db
      PORT: 8003
      PARALLEL_WORKERS: 4
      SPARK_MASTER_URL: spark://spark-master:7077
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Apache Spark Master (Nodo Maestro del Cluster de Cómputo)
  spark-master:
    image: bitnami/spark:3.5
    container_name: petmanager-spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080" # Spark Web UI
      - "7077:7077" # Spark Master URL
    networks:
      - app-network
    restart: unless-stopped

  # Apache Spark Worker (Nodo de Procesamiento Paralelo)
  spark-worker:
    image: bitnami/spark:3.5
    container_name: petmanager-spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    depends_on:
      - spark-master
    networks:
      - app-network
    restart: unless-stopped

  # Servidor Web Frontend y Reverse Proxy Nginx
  frontend:
    build:
      context: .
      dockerfile: microservices/frontend/Dockerfile
    container_name: petmanager-frontend
    ports:
      - "80:80"
    depends_on:
      service-auth:
        condition: service_healthy
      service-mascotas:
        condition: service_healthy
      service-analytics:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Servidor de Monitoreo Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: petmanager-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - app-network
    restart: unless-stopped

  # Visualización de Métricas Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: petmanager-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
